<div class="govuk-form-group" [ngClass]="{ 'form-group-error': !numberControl.valid }">
  <label class="govuk-label" [for]="id()">
    @if (questionField.question_text) {
      <span class="form-label govuk-!-font-weight-bold">{{ questionField.question_text | rpxTranslate }}</span>
    }
    @if (numberControl.errors && numberControl.touched) {
      <span class="error-message">{{ numberControl.errors | nocError | rpxTranslate }}</span>
    }
  </label>

  <input class="govuk-input govuk-input--width-10" [id]="id()" type="number" [formControl]="numberControl" />
</div>
