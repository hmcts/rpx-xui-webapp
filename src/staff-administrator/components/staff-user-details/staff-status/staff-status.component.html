@switch (status) {
  @case ('ACTIVE') {
    <div>
      <strong class="hmcts-badge hmcts-badge--green"> ACTIVE </strong>
    </div>
  }
  @case ('SUSPENDED') {
    <div>
      <strong class="hmcts-badge hmcts-badge--red"> SUSPENDED </strong>
    </div>
  }
  @case ('PENDING') {
    <span>
      <strong class="hmcts-badge hmcts-badge--blue"> PENDING </strong>
    </span>
  }
}
