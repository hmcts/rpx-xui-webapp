<div class="govuk-form-group" [ngClass]="{ 'form-group-error': !postcodeControl.valid }">
  <label class="govuk-label" [for]="id()">
    @if (questionField.question_text) {
      <span class="form-label govuk-!-font-weight-bold">{{ questionField.question_text | rpxTranslate }}</span>
    }
    @if (postcodeControl.errors && postcodeControl.touched) {
      <span class="error-message">{{ postcodeControl.errors | nocError | rpxTranslate }}</span>
    }
  </label>

  <input class="govuk-input govuk-input--width-10" [id]="id()" type="text" [formControl]="postcodeControl" />
</div>
