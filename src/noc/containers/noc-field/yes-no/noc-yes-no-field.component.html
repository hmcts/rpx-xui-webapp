<div class="govuk-form-group" [id]="id()" [ngClass]="{ 'form-group-error': !yesNoControl.valid }">
  <fieldset class="inline">
    <legend>
      @if (questionField.question_text) {
        <span class="form-label govuk-!-font-weight-bold">{{ questionField.question_text | rpxTranslate }}</span>
      }
      @if (yesNoControl.errors && yesNoControl.touched) {
        <span class="error-message">{{ yesNoControl.errors | nocError | rpxTranslate }}</span>
      }
    </legend>

    <div class="form-group" [id]="id()">
      @for (value of yesNoValues; track value) {
        <div class="multiple-choice" [ngClass]="{ selected: yesNoControl.value === value }">
          <input
            class="form-control"
            [id]="id() + '-' + value"
            [attr.name]="id()"
            [name]="id()"
            type="radio"
            [formControl]="yesNoControl"
            [value]="value"
          />
          <label class="form-label" [for]="id() + '-' + value">{{ value | rpxTranslate }}</label>
        </div>
      }
    </div>
  </fieldset>
</div>
