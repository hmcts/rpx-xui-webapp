@if (defaultLocations && defaultLocations.length) {
  <p>Access tasks and cases.</p>
}
@if (defaultLocations && !defaultLocations.length) {
  <p>{{ noDefaultLocationMessage }}</p>
}
<div class="button-heading" [ngClass]="{ hideFilter: hideFilter }">
  <button class="govuk-button hmcts-button--secondary" type="button" (click)="onToggleFilter(allowTypesOfWorkFilter)">
    {{ toggleFilter ? 'Hide' : 'Show' }} work filter
  </button>
  @if (showFilteredText) {
    <span class="hmcts-badge hmcts-badge--black">Filtered view</span>
    <span class="govuk-hint">All of your work may not be visible.</span>
  }
</div>
@if (toggleFilter) {
  <div class="govuk-!-padding-3 filter govuk-!-margin-bottom-3">
    <h2 class="govuk-visually-hidden">Work filter</h2>
    <xuilib-generic-filter [config]="fieldsConfig" [settings]="fieldsSettings"></xuilib-generic-filter>
  </div>
}
