<main class="govuk-main-wrapper" id="content" role="main">
  <exui-info-message-container></exui-info-message-container>
  <h3 class="govuk-heading-xl">All work</h3>
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-full">
      <p>View and manage all tasks and cases.</p>
      <nav class="govuk-service-navigation" aria-label="Sub navigation">
        <ul class="govuk-service-navigation__list">
          <li
            *ngFor="let item of subNavigationItems"
            class="govuk-service-navigation__item"
            [class.govuk-service-navigation__item--active]="item.active"
          >
            <a class="govuk-service-navigation__link" [routerLink]="item.href" [attr.aria-current]="item.active ? 'page' : null">
              {{ item.text }}
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
  <router-outlet></router-outlet>
</main>
