<h2 class="govuk-heading-m">
  Additional instructions
  @if (pageTitleDisplayLabel) {
    <exui-amendment-label [displayLabel]="pageTitleDisplayLabel"> </exui-amendment-label>
  }
</h2>
<div class="govuk-summary-list govuk-!-margin-bottom-9">
  <div class="govuk-summary-list__row">
    <div class="govuk-summary-list__key">Enter any additional instructions for the hearing</div>
    <div class="govuk-summary-list__value">
      <span [innerHtml]="additionalInstructions"></span>
      @if (showAmmended) {
        <exui-amendment-label [displayLabel]="amendmentLabelEnum.AMENDED"> </exui-amendment-label>
      }
    </div>
    <div class="govuk-summary-list__actions">
      <button id="additionalInstruction" class="govuk-js-link" type="button" (click)="onChange('additionalInstruction')">
        Change
      </button>
    </div>
  </div>
</div>
