<xuilib-hmcts-error-summary
  [errorMessages]="validationErrors"
  [header]="'There is a problem' | rpxTranslate"
></xuilib-hmcts-error-summary>

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <form class="form" [formGroup]="stageForm">
      <exui-hearing-parties-title></exui-hearing-parties-title>
      <h1 class="govuk-heading-l">{{ 'What stage is this hearing at?' | rpxTranslate }}</h1>
      <div class="govuk-form-group" [ngClass]="{ 'govuk-form-group--error': hearingStageSelectionError }">
        <fieldset class="govuk-fieldset" id="hearing-stage">
          @if (hearingStageSelectionError) {
            <span class="govuk-error-message">
              <span class="govuk-visually-hidden">{{ 'Error:' | rpxTranslate }}</span>
              {{ hearingStageSelectionError | rpxTranslate }}
            </span>
          }
          <div class="govuk-radios">
            <div class="govuk-radios">
              @for (option of hearingStageOptions; track option) {
                <div class="govuk-radios__item">
                  <input
                    class="govuk-radios__input"
                    id="{{ option.key }}"
                    formControlName="stage-option"
                    name="stage-option"
                    type="radio"
                    [value]="option.key"
                  />
                  <label class="govuk-label govuk-radios__label" [for]="option.key">{{ option.value_en }}</label>
                </div>
              }
            </div>
          </div>
        </fieldset>
      </div>
    </form>
  </div>
</div>
