@if (showSpinner$ | async) {
  <xuilib-loading-spinner></xuilib-loading-spinner>
}
@if (warningIncluded) {
  <exui-task-alert-banner [tasks]="tasks" alertTitle="Task alert"> </exui-task-alert-banner>
}
<div class="govuk-tabs__panel active-tasks-container" id="event">
  <div>
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds govuk-!-padding-4">
        <h2 class="govuk-heading-m">Active tasks</h2>
        @if (tasks) {
          @for (task of tasks; track task) {
            <exui-case-task
              [task]="task"
              [caseworkers]="caseworkers"
              (taskRefreshRequired)="onTaskRefreshRequired($event)"
            ></exui-case-task>
          }
        }
      </div>
    </div>
  </div>
</div>
