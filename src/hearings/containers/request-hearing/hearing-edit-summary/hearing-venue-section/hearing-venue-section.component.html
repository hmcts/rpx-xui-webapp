<h2 class="govuk-heading-m">
  Hearing venue
  @if (showAmmendedForHeading) {
    <exui-amendment-label [displayLabel]="amendmentLabelEnum.AMENDED"> </exui-amendment-label>
  }
</h2>
<div class="govuk-summary-list govuk-!-margin-bottom-9">
  <div class="govuk-summary-list__row">
    <div class="govuk-summary-list__key">What are the hearing venue details</div>
    <div class="govuk-summary-list__value">
      <ul>
        @for (location of locations$ | async; track location) {
          <li>
            {{ location.court_name }}
            @if (showAmmended(location.epimms_id)) {
              <exui-amendment-label [displayLabel]="amendmentLabelEnum.AMENDED"> </exui-amendment-label>
            }
          </li>
        }
      </ul>
    </div>
    <div class="govuk-summary-list__actions">
      <button id="venue" class="govuk-js-link" type="button" (click)="onChange('venue')">Change</button>
    </div>
  </div>
</div>
