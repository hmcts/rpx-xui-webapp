@if (showSpinner$ | async) {
  <xuilib-loading-spinner></xuilib-loading-spinner>
}
@if (waSupportedDetailedServices$ | async; as jurisdictions) {
  <div class="tasks-container">
    <exui-task-manager-filter
      [jurisdictions]="jurisdictions"
      [waSupportedJurisdictions]="supportedJurisdictions"
      (selectionChanged)="onSelectionChanged($event)"
    ></exui-task-manager-filter>
    <div class="hmcts-filter-layout__content exui-task-list">
      <exui-task-list
        [taskServiceConfig]="taskServiceConfig"
        [tasks]="tasks"
        [fields]="fields"
        [tasksTotal]="tasksTotal"
        [pagination]="pagination"
        [sortedBy]="sortedBy"
        [emptyMessage]="emptyMessage"
        [pageSessionKey]="pageSessionKey"
        (paginationEvent)="onPaginationEvent($event)"
        (sortEvent)="onSortHandler($event)"
        (actionEvent)="onActionHandler($event)"
      >
      </exui-task-list>
    </div>
  </div>
}
