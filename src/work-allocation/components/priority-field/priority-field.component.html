@switch (priority) {
  @case ('URGENT') {
    <strong class="hmcts-badge hmcts-badge--red"> urgent </strong>
  }
  @case ('HIGH') {
    <strong class="govuk-tag govuk-tag--red"> high </strong>
  }
  @case ('MEDIUM') {
    <strong class="govuk-tag govuk-tag--yellow"> medium </strong>
  }
  @case ('LOW') {
    <strong class="govuk-tag govuk-tag--grey"> low </strong>
  }
}
