<div class="govuk-form-group" [ngClass]="{ 'form-group-error': !emailControl.valid }">
  <label [for]="id()">
    <span class="form-label govuk-!-font-weight-bold" questionField.question_text>{{
      questionField.question_text | rpxTranslate
    }}</span>
    @if (emailControl.errors && emailControl.touched) {
      <span class="error-message">{{ emailControl.errors | nocError | rpxTranslate }}</span>
    }
  </label>

  <input class="govuk-input govuk-input--width-10" [id]="id()" type="email" [formControl]="emailControl" />
</div>
