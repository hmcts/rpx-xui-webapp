<h2 class="govuk-heading-m">
  Language requirements
  @if (showAmmended) {
    <exui-amendment-label [displayLabel]="amendmentLabelEnum.AMENDED"> </exui-amendment-label>
  }
</h2>
<div class="govuk-summary-list govuk-!-margin-bottom-9">
  <div class="govuk-summary-list__row">
    <div class="govuk-summary-list__key">Does this hearing need to be in Welsh?</div>
    <div class="govuk-summary-list__value">
      {{ hearingInWelshFlag ? 'Yes' : 'No' }}
      @if (showAmmended) {
        <exui-amendment-label [displayLabel]="amendmentLabelEnum.AMENDED"> </exui-amendment-label>
      }
    </div>
    <div class="govuk-summary-list__actions">
      <button id="needWelsh" type="button" class="govuk-js-link" (click)="onChange('needWelsh')">Change</button>
    </div>
  </div>
</div>
