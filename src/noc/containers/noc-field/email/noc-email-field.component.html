<div class="govuk-form-group" [ngClass]="{ 'form-group-error': !emailControl.valid && emailControl.dirty }">
  <label [for]="id()">
    <span class="form-label govuk-!-font-weight-bold" questionField.question_text>{{
      questionField.question_text | rpxTranslate
    }}</span>
    <span class="error-message" *ngIf="emailControl.errors && emailControl.dirty">{{
      emailControl.errors | nocError | rpxTranslate
    }}</span>
  </label>

  <input class="govuk-input govuk-input--width-10" [id]="id()" type="email" [formControl]="emailControl" />
</div>
