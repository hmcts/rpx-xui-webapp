<details class="govuk-details" data-module="govuk-details">
  <summary class="govuk-details__summary">
    <span class="govuk-details__summary-text">{{ 'See dates the parties will not be available' | rpxTranslate }}</span>
    @if (showAmendedLabel) {
      <exui-amendment-label [displayLabel]="amendmentLabelEnum.AMENDED"> </exui-amendment-label>
    }
  </summary>
  <div class="govuk-details__text">
    @if (unAvailableDates?.length === 0) {
      <div>
        <span>{{ 'Party unavailability dates are not specified' | rpxTranslate }}<br /></span>
      </div>
    }
    <div [ngClass]="{ 'scroll-view': $safeNavigationMigration(unAvailableDates?.length) > maxScrollBarDatesLength }">
      @for (unAvailableDate of unAvailableDates; track unAvailableDate) {
        <span>{{ unAvailableDate }}<br /></span>
      }
    </div>
  </div>
</details>
