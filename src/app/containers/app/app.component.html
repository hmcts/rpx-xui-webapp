@if (isCookieBannerVisible) {
  <xuilib-cookie-banner
    [identifier]="cookieName"
    [appName]="'this service'"
    [enableDynatrace]="true"
    (acceptanceNotifier)="notifyAcceptance()"
    (rejectionNotifier)="notifyRejection()"
  ></xuilib-cookie-banner>
}

<router-outlet></router-outlet>

@if (timeoutModalConfig.isVisible) {
  <xuilib-session-dialog positionTop="300px" (close)="staySignedInHandler()">
    <h3 class="govuk-heading-m">We are about to sign you out</h3>
    <p class="govuk-body">
      For your security, we will sign you out of your account in
      <strong style="font-weight: bold">{{ timeoutModalConfig.countdown }}</strong>
    </p>
    <p>Any information you have not saved will be lost</p>
    <button type="submit" class="govuk-button stay-signed-in-button" (click)="staySignedInHandler()">Stay signed in</button>
    <button type="submit" class="govuk-button govuk-button--secondary" (click)="signOutHandler()">Sign out</button>
  </xuilib-session-dialog>
}
