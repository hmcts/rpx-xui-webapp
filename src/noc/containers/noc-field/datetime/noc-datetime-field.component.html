<div class="govuk-form-group" [ngClass]="{ 'govuk-form-group--error': datetimeControl.errors && datetimeGroup.touched }">
  <fieldset
    class="govuk-fieldset"
    [attr.aria-describedby]="datetimeControl.errors && datetimeGroup.touched ? id() + '-error' : null"
  >
    <legend class="govuk-fieldset__legend govuk-fieldset__legend--s govuk-!-font-weight-bold">
      <ng-container *ngIf="questionField.question_text">{{ questionField.question_text | rpxTranslate }}</ng-container>
    </legend>
    <span class="govuk-error-message" *ngIf="datetimeControl.errors && datetimeGroup.touched" [id]="id() + '-error'">
      <span class="govuk-visually-hidden">{{ 'Error:' | rpxTranslate }}</span>
      {{ datetimeControl.errors | nocError | rpxTranslate }}
    </span>

    <div class="govuk-date-input" [id]="id()" [formGroup]="datetimeGroup">
      <div class="govuk-date-input__item">
        <div class="govuk-form-group">
          <label class="govuk-label govuk-date-input__label" [for]="dayId()">{{ 'Day' | rpxTranslate }}</label>
          <input
            #dayInput
            class="govuk-input govuk-date-input__input govuk-input--width-2"
            [id]="dayId()"
            type="text"
            inputmode="numeric"
            oninput="this.value = this.value.slice(0, this.maxLength)"
            maxlength="2"
            formControlName="day"
          />
        </div>
      </div>
      <div class="govuk-date-input__item">
        <div class="govuk-form-group">
          <label class="govuk-label govuk-date-input__label" [for]="monthId()">{{ 'Month' | rpxTranslate }}</label>
          <input
            #monthInput
            class="govuk-input govuk-date-input__input govuk-input--width-2"
            [id]="monthId()"
            type="text"
            inputmode="numeric"
            oninput="this.value = this.value.slice(0, this.maxLength)"
            maxlength="2"
            formControlName="month"
          />
        </div>
      </div>
      <div class="govuk-date-input__item">
        <div class="govuk-form-group">
          <label class="govuk-label govuk-date-input__label" [for]="yearId()">{{ 'Year' | rpxTranslate }}</label>
          <input
            #yearInput
            class="govuk-input govuk-date-input__input govuk-input--width-4"
            [id]="yearId()"
            type="text"
            inputmode="numeric"
            oninput="this.value = this.value.slice(0, this.maxLength)"
            maxlength="4"
            formControlName="year"
          />
        </div>
      </div>
      <div class="govuk-date-input__item">
        <div class="govuk-form-group">
          <label class="govuk-label govuk-date-input__label" [for]="hourId()">{{ 'Hour' | rpxTranslate }}</label>
          <input
            #hourInput
            class="govuk-input govuk-date-input__input govuk-input--width-2"
            [id]="hourId()"
            type="text"
            inputmode="numeric"
            oninput="this.value = this.value.slice(0, this.maxLength)"
            maxlength="2"
            formControlName="hour"
          />
        </div>
      </div>
      <div class="govuk-date-input__item">
        <div class="govuk-form-group">
          <label class="govuk-label govuk-date-input__label" [for]="minuteId()">{{ 'Minute' | rpxTranslate }}</label>
          <input
            #minuteInput
            class="govuk-input govuk-date-input__input govuk-input--width-2"
            [id]="minuteId()"
            type="text"
            inputmode="numeric"
            oninput="this.value = this.value.slice(0, this.maxLength)"
            maxlength="2"
            formControlName="minute"
          />
        </div>
      </div>
      <div class="govuk-date-input__item">
        <div class="govuk-form-group">
          <label class="govuk-label govuk-date-input__label" [for]="secondId()">{{ 'Second' | rpxTranslate }}</label>
          <input
            #secondInput
            class="govuk-input govuk-date-input__input govuk-input--width-2"
            [id]="secondId()"
            type="text"
            inputmode="numeric"
            oninput="this.value = this.value.slice(0, this.maxLength)"
            maxlength="2"
            formControlName="second"
          />
        </div>
      </div>
    </div>
  </fieldset>
</div>
