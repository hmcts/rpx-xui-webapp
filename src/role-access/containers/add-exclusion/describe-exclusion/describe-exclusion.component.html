@if (error) {
  <exui-error-message [error]="error"></exui-error-message>
}
<div
  [formGroup]="formGroup"
  class="govuk-form-group"
  [ngClass]="{ 'form-group-error': !formGroup.get(controlName).valid && formGroup.get(controlName).touched && submitted }"
>
  <h1 class="govuk-heading-l">
    <span class="govuk-caption-l">{{ caption }}</span>
    {{ title }}
  </h1>
  @if (!formGroup.get(controlName).valid && formGroup.get(controlName).touched && submitted) {
    <span id="more-detail-error" class="govuk-error-message">
      <span class="govuk-visually-hidden">Error:</span> Enter exclusion
    </span>
  }
  <fieldset class="govuk-fieldset">
    <textarea
      [ngClass]="{
        'govuk-textarea--error': !formGroup.get(controlName).valid && formGroup.get(controlName).touched && submitted,
      }"
      class="govuk-textarea govuk-!-width-one-half govuk-!-margin-bottom-0"
      id="exclusion-description"
      formControlName="text"
      name="exclusion-description"
      rows="5"
      aria-label="exclusion description"
    ></textarea>
  </fieldset>
</div>
