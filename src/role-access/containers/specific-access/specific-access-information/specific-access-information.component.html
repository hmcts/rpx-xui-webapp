<exui-error-message *ngIf="!formGroup.get(controlName).valid && submitted" [error]="error"></exui-error-message>
<h1 class="govuk-heading-l">
  <span class="govuk-caption-l">{{ caption }}</span>
  {{ title }}
</h1>
<div
  class="govuk-form-group"
  [ngClass]="{ 'form-group-error': !formGroup.get(controlName).valid && submitted }"
  [formGroup]="formGroup"
>
  <span id="more-detail-error" class="govuk-error-message" *ngIf="!formGroup.get(controlName).valid && submitted">
    <span class="govuk-visually-hidden">Error:</span> Enter details
  </span>
  <div>
    <div id="more-detail-hint" class="govuk-hint">This information will be sent to the person requesting access to the case.</div>
    <textarea
      [ngClass]="{ 'govuk-textarea--error': !formGroup.get(controlName).valid && submitted }"
      [formGroup]="formGroup"
      formControlName="infoCtrl"
      class="govuk-textarea"
      id="more-detail"
      name="more-detail"
      rows="5"
      [attr.aria-label]="title"
      [attr.aria-describedby]="
        !formGroup.get(controlName).valid && submitted ? 'more-detail-hint more-detail-error' : 'more-detail-hint'
      "
    ></textarea>
  </div>
</div>
