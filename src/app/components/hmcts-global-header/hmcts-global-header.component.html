<header class="govuk-header hmcts-header" role="banner">
  <div class="govuk-header__container govuk-width-container hmcts-header__container">
    <ng-container [ngSwitch]="logo">
      <!-- Logo for Judicial Users -->
      <ng-container *ngSwitchCase="'judicial'">
        <div class="judicial-header__logo" *ngIf="showItems">
          <a [routerLink]="'/'" class="govuk-header__link govuk-header__link--homepage">
            <img class="img-responsive" alt="GOV.UK logo" src="/assets/images/govuk-crest-jcm.png" width="83px" />
          </a>
        </div>
        <div class="govuk-header__logo"></div>
        <a
          *ngIf="headerTitle?.name"
          class="govuk-header__link exui-header-title"
          [routerLink]="headerTitle?.url"
          [attr.aria-label]="headerTitle?.name | rpxTranslate"
        >
          {{ headerTitle?.name | rpxTranslate }}
        </a>
      </ng-container>

      <!-- Logo for Case Manager Users -->
      <ng-container *ngSwitchCase="'myhmcts'">
        <div class="govuk-header__logo">
          <a [routerLink]="'/'" class="govuk-header__link govuk-header__link--homepage">
            <span class="govuk-header__logotype">
              <span class="govuk-header__logotype-text"> MyHMCTS </span>
            </span>
          </a>
        </div>
        <a
          *ngIf="headerTitle?.name"
          class="govuk-header__link exui-header-title"
          [routerLink]="headerTitle?.url"
          [attr.aria-label]="headerTitle?.name | rpxTranslate"
        >
          {{ headerTitle?.name | rpxTranslate }}
        </a>
      </ng-container>
      <!-- Logo for Users (Default) -->
      <ng-container *ngSwitchDefault>
        <div *ngIf="!headerTitle?.name" class="govuk-header__logo">
          <a [routerLink]="'/'" class="govuk-header__link govuk-header__link--homepage">
            <span class="govuk-header__logotype">
              <span class="govuk-header__logotype-text"> MyHMCTS </span>
            </span>
          </a>
        </div>
        <div class="govuk-header__logo" *ngIf="headerTitle?.name">
          <a class="govuk-header__link exui-header-title" [routerLink]="'/'" [attr.aria-label]="headerTitle?.name | rpxTranslate">
            {{ headerTitle?.name | rpxTranslate }}
          </a>
        </div>
      </ng-container>
    </ng-container>

    <!-- HMCTS header navigation items displayed in top right-hand corner (currently, just one: "Sign out") -->
    <div class="govuk-header__content exui-header-actions">
      <nav class="govuk-header__navigation" attr.aria-label="{{ navigation?.label | rpxTranslate }}">
        <ul class="govuk-header__navigation-list">
          <li *ngFor="let item of navigation?.items; let i = index" class="govuk-header__navigation-item">
            <button type="button" class="govuk-link exui-header-action-link" (click)="onEmitEvent(i)" *ngIf="userValue">
              {{ item.text | rpxTranslate }}
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</header>

<nav *ngIf="showItems" class="govuk-service-navigation" aria-label="Primary navigation">
  <div class="govuk-width-container exui-service-navigation__container">
    <div class="govuk-service-navigation__wrapper exui-service-navigation__left">
      <ul class="govuk-service-navigation__list">
        <li
          class="govuk-service-navigation__item"
          [class.govuk-service-navigation__item--active]="item?.active"
          *ngFor="let item of leftItems | async"
        >
          <a
            class="govuk-service-navigation__link"
            (click)="onEmitSubMenu(item)"
            [attr.aria-current]="item?.active ? 'page' : null"
            [routerLink]="item?.href"
          >
            {{ item.text | rpxTranslate }}
          </a>
        </li>
      </ul>
    </div>

    <div class="govuk-service-navigation__wrapper exui-service-navigation__right">
      <ul class="govuk-service-navigation__list">
        <li
          class="govuk-service-navigation__item"
          [class.govuk-service-navigation__item--active]="item.active"
          *ngFor="let item of rightItems | async"
        >
          <a
            *ngIf="(isUserCaseManager$ | async) || !isGlobalSearchEnabled"
            class="govuk-service-navigation__link"
            [ngClass]="item.ngClass"
            (click)="onEmitSubMenu(item)"
            [attr.aria-current]="item.active ? 'page' : null"
            [routerLink]="item.href"
          >
            {{ item.text | rpxTranslate }}
          </a>
          <exui-case-reference-search-box
            *ngIf="!(isUserCaseManager$ | async) && isGlobalSearchEnabled"
            [item]="item"
            [decorate16DigitCaseReferenceSearchBoxInHeader]="decorate16DigitCaseReferenceSearchBoxInHeader"
          >
          </exui-case-reference-search-box>
        </li>
      </ul>
    </div>
  </div>
</nav>
