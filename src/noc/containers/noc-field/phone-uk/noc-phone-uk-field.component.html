<div class="govuk-form-group" [ngClass]="{ 'form-group-error': !phoneUkControl.valid && phoneUkControl.dirty }">
  <label class="govuk-label" [for]="id()">
    <span class="form-label govuk-!-font-weight-bold" *ngIf="questionField.question_text">{{
      questionField.question_text | rpxTranslate
    }}</span>
    <span class="error-message" *ngIf="phoneUkControl.errors && phoneUkControl.dirty">{{
      phoneUkControl.errors | nocError | rpxTranslate
    }}</span>
  </label>
  <input class="govuk-input govuk-input--width-10" [id]="id()" type="tel" [formControl]="phoneUkControl" />
</div>
