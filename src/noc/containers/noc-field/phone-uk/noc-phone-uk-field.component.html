<div class="govuk-form-group" [ngClass]="{ 'form-group-error': !phoneUkControl.valid }">
  <label class="govuk-label" [for]="id()">
    @if (questionField.question_text) {
      <span class="form-label govuk-!-font-weight-bold">{{ questionField.question_text | rpxTranslate }}</span>
    }
    @if (phoneUkControl.errors && phoneUkControl.touched) {
      <span class="error-message">{{ phoneUkControl.errors | nocError | rpxTranslate }}</span>
    }
  </label>
  <input class="govuk-input govuk-input--width-10" [id]="id()" type="tel" [formControl]="phoneUkControl" />
</div>
