<div>
  <h1 class="govuk-heading-l">
    <span class="govuk-caption-l">{{ caption }}</span>
    {{ heading }}
  </h1>
  <span class="govuk-hint">{{ hint }}</span>
  <dl class="govuk-summary-list govuk-!-margin-bottom-9">
    @for (answer of answers; track answer) {
      <div class="govuk-summary-list__row">
        <dt class="govuk-summary-list__key">
          {{ answer.label }}
        </dt>
        <dd class="govuk-summary-list__value" [innerText]="answer.value"></dd>
        @if (answer.action != null) {
          <dd class="govuk-summary-list__actions">
            <button class="govuk-js-link" (click)="changeAction(answer.action)">
              Change<span class="govuk-visually-hidden"> who the exclusion is for</span>
            </button>
          </dd>
        }
      </div>
    }
  </dl>
</div>
