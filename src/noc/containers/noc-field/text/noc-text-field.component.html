<div class="govuk-form-group" [ngClass]="{ 'form-group-error': !textControl.valid }">
  <label class="govuk-label" [for]="id()">
    @if (questionField.question_text) {
      <span class="form-label govuk-!-font-weight-bold">{{ questionField.question_text | rpxTranslate }}</span>
    }
    @if (textControl.errors && textControl.touched) {
      <span class="error-message">{{ textControl.errors | nocError | rpxTranslate }}</span>
    }
  </label>

  <input class="govuk-input govuk-!-width-one-half" [id]="id()" type="text" [formControl]="textControl" />
</div>
