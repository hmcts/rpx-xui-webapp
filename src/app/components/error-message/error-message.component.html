@if (error) {
  <div
    class="govuk-error-summary"
    aria-labelledby="error-summary-title"
    role="alert"
    tabindex="-1"
    data-module="govuk-error-summary"
  >
    <h2 class="govuk-error-summary__title" id="error-summary-title">{{ error.title | rpxTranslate }}</h2>
    <div class="govuk-error-summary__body">
      <ul class="govuk-list govuk-error-summary__list">
        @if (error.multiple) {
          @for (error of error.errors; track error) {
            <li>
              <a tabindex="0" [attr.href]="'#' + error.name">{{ error.error | rpxTranslate }}</a>
            </li>
          }
        } @else {
          <li>
            <a tabindex="0" [attr.href]="'#' + error.fieldId">{{ error.description | rpxTranslate }}</a>
          </li>
        }
      </ul>
    </div>
  </div>
}
