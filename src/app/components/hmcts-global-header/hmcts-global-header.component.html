<div class="govuk-header exui-header" data-module="govuk-header">
  <div class="govuk-header__container govuk-width-container exui-header__container">
    <div class="govuk-header__logo exui-header__logo">
      <img *ngIf="logo === 'judicial'" class="exui-header__crest" src="/assets/images/govuk-crest-jcm.png" alt="" width="83" />
      <a class="govuk-header__homepage-link exui-header__service-name" [routerLink]="serviceUrl">
        <span *ngIf="logo === 'myhmcts'" class="exui-header__product-name">MyHMCTS</span>
        {{ headerTitle?.name || 'MyHMCTS' | rpxTranslate }}
      </a>
    </div>
    <ul *ngIf="userValue && navigation?.items?.length" class="exui-header__account">
      <li *ngFor="let item of navigation.items; let i = index" class="exui-header__account-item">
        <button type="button" class="exui-header__account-link" (click)="onEmitEvent(i)">
          {{ item.text | rpxTranslate }}
        </button>
      </li>
    </ul>
  </div>
</div>

<section
  *ngIf="showItems"
  class="govuk-service-navigation"
  data-module="govuk-service-navigation"
  [attr.aria-label]="'Service information' | rpxTranslate"
>
  <div class="govuk-width-container">
    <div class="govuk-service-navigation__container">
      <nav class="govuk-service-navigation__wrapper" [attr.aria-label]="'Primary navigation' | rpxTranslate">
        <ul class="govuk-service-navigation__list" id="navigation">
          <ng-container *ngIf="showItems">
            <li
              *ngFor="let item of leftItems | async"
              class="govuk-service-navigation__item exui-service-navigation__item--menu"
              [class.govuk-service-navigation__item--active]="item?.active"
            >
              <a
                *ngIf="item.decentralisedServiceId"
                class="govuk-service-navigation__link"
                (click)="onEmitSubMenu(item)"
                href="{{ item.href }}"
              >
                {{ item.text | rpxTranslate }}
              </a>
              <a
                *ngIf="!item.decentralisedServiceId"
                class="govuk-service-navigation__link"
                (click)="onEmitSubMenu(item)"
                [attr.aria-current]="item?.active ? 'page' : null"
                [routerLink]="item?.href"
              >
                <strong *ngIf="item?.active; else itemText" class="govuk-service-navigation__active-fallback">{{
                  item.text | rpxTranslate
                }}</strong>
                <ng-template #itemText>{{ item.text | rpxTranslate }}</ng-template>
              </a>
            </li>

            <li
              *ngFor="let item of rightItems | async"
              class="govuk-service-navigation__item exui-service-navigation__item--search exui-service-navigation__item--end"
              [class.govuk-service-navigation__item--active]="
                item?.active && ((isUserCaseManager$ | async) || !isGlobalSearchEnabled)
              "
            >
              <a
                *ngIf="(isUserCaseManager$ | async) || !isGlobalSearchEnabled"
                class="govuk-service-navigation__link"
                [ngClass]="item.ngClass"
                (click)="onEmitSubMenu(item)"
                [attr.aria-current]="item.active ? 'page' : null"
                [routerLink]="item.href"
              >
                {{ item.text | rpxTranslate }}
              </a>
              <exui-case-reference-search-box
                *ngIf="!(isUserCaseManager$ | async) && isGlobalSearchEnabled"
                [item]="item"
                [decorate16DigitCaseReferenceSearchBoxInHeader]="decorate16DigitCaseReferenceSearchBoxInHeader"
              >
              </exui-case-reference-search-box>
            </li>
          </ng-container>
        </ul>
      </nav>
    </div>
  </div>
</section>
