<div class="govuk-form-group" [ngClass]="{ 'form-group-error': !numberControl.valid && numberControl.dirty }">
  <label class="govuk-label" [for]="id()">
    <span class="form-label govuk-!-font-weight-bold" *ngIf="questionField.question_text">{{
      questionField.question_text | rpxTranslate
    }}</span>
    <span class="error-message" *ngIf="numberControl.errors && numberControl.dirty">{{
      numberControl.errors | nocError | rpxTranslate
    }}</span>
  </label>

  <input class="govuk-input govuk-input--width-10" [id]="id()" type="number" [formControl]="numberControl" />
</div>
